# Categories for automatically generated release notes.
changelog:
  exclude:
    labels: ["ignore-for-release"]
  categories:
    - title: 🔒 Security and privacy
      labels: ["security"]
    - title: ✨ Features
      labels: ["enhancement"]
    - title: 🔎 Detectors
      labels: ["detector"]
    - title: 🐛 Fixes
      labels: ["bug", "false-positive"]
    - title: 📦 Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
