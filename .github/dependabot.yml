# Dependabot keeps the GitHub Actions in .github/workflows current.
# The Bun dev dependencies (TypeScript, Biome, dprint, @types/bun) are pinned and updated by hand:
# Dependabot's Bun support reads only bun.lock version 1, and Bun 1.4 writes version 2.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
